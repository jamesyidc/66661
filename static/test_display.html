<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>测试4个平均位置显示</title>
    <style>
        body { background: #1a1a2e; color: white; padding: 20px; font-family: Arial; }
        .box { background: rgba(0,0,0,0.2); padding: 20px; margin: 10px; border-radius: 10px; }
        .value { font-size: 24px; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>27币平均位置显示测试</h1>
    <div class="box">
        <div>4小时平均位置: <span class="value" id="avg-4h">加载中...</span></div>
        <div>12小时平均位置: <span class="value" id="avg-12h">加载中...</span></div>
        <div>24小时平均位置: <span class="value" id="avg-24h">加载中...</span></div>
        <div>48小时平均位置: <span class="value" id="avg-48h">加载中...</span></div>
    </div>
    <div class="box">
        <h3>API响应:</h3>
        <pre id="response" style="color: #4ade80;">等待中...</pre>
    </div>

    <script>
        fetch('/api/position/summary')
            .then(res => res.json())
            .then(data => {
                document.getElementById('response').textContent = JSON.stringify(data, null, 2);
                
                if (data.success && data.averages) {
                    document.getElementById('avg-4h').textContent = data.averages['4h'].toFixed(2) + '%';
                    document.getElementById('avg-12h').textContent = data.averages['12h'].toFixed(2) + '%';
                    document.getElementById('avg-24h').textContent = data.averages['24h'].toFixed(2) + '%';
                    document.getElementById('avg-48h').textContent = data.averages['48h'].toFixed(2) + '%';
                    document.getElementById('avg-4h').style.color = '#54a0ff';
                    document.getElementById('avg-12h').style.color = '#5f27cd';
                    document.getElementById('avg-24h').style.color = '#ff6b81';
                    document.getElementById('avg-48h').style.color = '#f39c12';
                } else {
                    document.getElementById('response').textContent = '❌ 数据加载失败';
                    document.getElementById('response').style.color = '#ef4444';
                }
            })
            .catch(err => {
                document.getElementById('response').textContent = '❌ 错误: ' + err.message;
                document.getElementById('response').style.color = '#ef4444';
            });
    </script>
</body>
</html>
