<!DOCTYPE html>
<html>
<head>
    <title>Coin Display Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a1a; color: #fff; }
        .card { background: rgba(0,0,0,0.3); padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 3px solid #4ade80; }
        .coin-item { margin: 5px 0; padding: 5px; background: rgba(255,255,255,0.05); border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>币种显示测试</h1>
    <button onclick="testWithCoins()">测试有币种数据</button>
    <button onclick="testWithoutCoins()">测试无币种数据</button>
    <div id="result"></div>

    <script>
        function buildScenarioCard(title, count, coinsData, color) {
            console.log('🏗️ 构建场景卡片:', {title, count, coinsDataType: typeof coinsData, coinsData});
            
            let coins = [];
            
            // 如果coinsData已经是数组，直接使用；如果是字符串，尝试解析
            if (Array.isArray(coinsData)) {
                coins = coinsData;
                console.log('✅ 币种数据已经是数组:', coins.length, '个币种');
            } else if (typeof coinsData === 'string') {
                try {
                    coins = JSON.parse(coinsData || '[]');
                    console.log('✅ 成功解析币种JSON:', coins.length, '个币种');
                } catch (e) {
                    console.error('❌ 解析币种列表失败:', e);
                }
            } else {
                console.warn('⚠️ 币种数据格式未知:', typeof coinsData);
            }
            
            let html = `
                <div class="card" style="border-left-color: ${color};">
                    <h4 style="color: ${color}; margin-bottom: 10px;">${title}</h4>
                    <div style="font-size: 24px; font-weight: bold; color: ${color}; margin-bottom: 10px;">${count} 个</div>
            `;
            
            if (coins.length > 0) {
                html += '<div style="max-height: 200px; overflow-y: auto;">';
                coins.forEach(coin => {
                    html += `
                        <div class="coin-item">
                            <strong style="color: #fff;">${coin.symbol}</strong>
                            <span style="color: rgba(255,255,255,0.7);"> - $${coin.current_price?.toFixed(6) || 'N/A'}</span>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += '<p style="color: rgba(255,255,255,0.5); font-size: 12px;">无币种</p>';
            }
            
            html += '</div>';
            return html;
        }

        function testWithCoins() {
            const coinsData = [
                {symbol: 'BTCUSDT', current_price: 43250.50},
                {symbol: 'ETHUSDT', current_price: 2280.75},
                {symbol: 'BNBUSDT', current_price: 310.25}
            ];
            
            const html = buildScenarioCard('测试：有币种数据', 3, coinsData, '#4ade80');
            document.getElementById('result').innerHTML = html;
        }

        function testWithoutCoins() {
            const coinsData = [];
            
            const html = buildScenarioCard('测试：无币种数据', 0, coinsData, '#f87171');
            document.getElementById('result').innerHTML = html;
        }
    </script>
</body>
</html>
